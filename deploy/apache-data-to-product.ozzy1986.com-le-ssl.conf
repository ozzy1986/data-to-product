# HTTPS-vhost. Сертификат выпускает certbot (certonly), пути стандартные.
# Веб-форма (current/public) — с диска; /api — сервис на 127.0.0.1:8103 (deploy/d2p.service).
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName data-to-product.ozzy1986.com

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/data-to-product.ozzy1986.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/data-to-product.ozzy1986.com/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    DocumentRoot /var/www/data-to-product.ozzy1986.com/current/public
    <Directory /var/www/data-to-product.ozzy1986.com/current/public>
        Require all granted
        Options -Indexes
        AllowOverride None
        DirectoryIndex index.html
    </Directory>
    <LocationMatch "^/(index\.html|app\.js|style\.css)?$">
        Header set Cache-Control "public, max-age=300"
    </LocationMatch>

    # Генерация с повторами занимает до нескольких минут — таймаут прокси с запасом.
    ProxyPreserveHost On
    ProxyPass        /api/ http://127.0.0.1:8103/api/ retry=0 timeout=900
    ProxyPassReverse /api/ http://127.0.0.1:8103/api/
    RequestHeader set X-Forwarded-Proto "https"

    # Размер тела проверяет приложение (LimitRequestBody на проксируемые запросы здесь не действует).
    LimitRequestFields 50
    LimitRequestLine 4094

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "no-referrer"
    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
    Header always set Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    Header always set X-Robots-Tag "noindex, nofollow"

    ErrorLog ${APACHE_LOG_DIR}/data-to-product.ozzy1986.com_error.log
    CustomLog ${APACHE_LOG_DIR}/data-to-product.ozzy1986.com_access.log combined
</VirtualHost>
</IfModule>
